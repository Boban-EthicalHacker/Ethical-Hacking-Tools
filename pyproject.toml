[project]
name = "moravasploit"
version = "0.1.0"
description = "Open-source tool for authorized security testing of systems and networks"
readme = "README.md"
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.11"
authors = [
    { name = "Boban", email = "boban.webdevelopment92@gmail.com" }
]
dependencies = [
    "rich>=13.7",
]

[project.scripts]
moravasploit = "moravasploit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moravasploit"]